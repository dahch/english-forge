services:
  backend:
    build: ./backend
    ports:
      - "8230:8230"
    env_file:
      - path: .env
        required: false
    volumes:
      - backend_data:/app/data
    networks:
      - app
      - coolify
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8230}
    ports:
      - "3590:3590"
    networks:
      - app
    depends_on:
      - backend
    restart: unless-stopped

networks:
  app:
    driver: bridge
  coolify:
    external: true

volumes:
  backend_data:
