services:
  backend:
    build: ./backend
    ports:
      - "8230:8230"
    env_file: .env
    volumes:
      - backend_data:/app/data
    networks:
      - app
      - coolify
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8230}
    ports:
      - "3590:3590"
    networks:
      - app
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: englishforge
      POSTGRES_USER: ${DB_USER:-englishforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-englishforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-englishforge}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  app:
    driver: bridge
  coolify:
    external: true

volumes:
  pgdata:
  backend_data:
